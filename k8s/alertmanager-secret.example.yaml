apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: sre-final-project
type: Opaque
# Copy this file to k8s/alertmanager-secret.yaml (gitignored), replace the values, then:
#   kubectl apply -f k8s/alertmanager-secret.yaml
# Each key becomes a file under /etc/alertmanager-secrets/ in the Alertmanager pod.
stringData:
  # Slack: Apps -> Incoming Webhooks -> Add New Webhook to Workspace
  slack-webhook-url: "replace-with-your-slack-incoming-webhook-url"
  # SMTP password or app-specific password (for example a Google App Password)
  smtp-auth-password: "app-password-placeholder-change-me"
