# Grafana with everything provisioned as code (SRE Academy exercises 6, 11 and 12):
#   datasources  k8s/config/grafana/datasources.yaml  (Prometheus, Loki, Jaeger, Alertmanager)
#   dashboards   k8s/config/grafana/dashboards/*.json  (SRE overview, golden signals, SLO)
#   alerting     k8s/config/grafana/alerting.yaml      (Grafana-managed rules sent to Alertmanager)
# The admin Secret "grafana-admin-credentials" is created by the deploy script from
# k8s/grafana-secret.example.yaml; the real file is gitignored.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: admin-password
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/sre-metrics.json
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            # Lab only (Grafana is reachable only through a port-forward on this laptop): anyone who opens it sees the
            # dashboards without logging in, as a Viewer. Viewers may use Explore (logs, traces) but cannot save
            # changes. Changing dashboards or alert rules still needs the admin login from grafana-admin-credentials.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_USERS_VIEWERS_CAN_EDIT
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          # Grafana builds its database on every fresh start (about 400 migrations). On a slow laptop or right after
          # "minikube start" that takes 1-3 minutes, and the liveness probe would kill it before it is done, in a loop.
          # The startup probe gives it up to 5 minutes; liveness only starts after the first success.
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: alerting
          configMap:
            name: grafana-alerting
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
