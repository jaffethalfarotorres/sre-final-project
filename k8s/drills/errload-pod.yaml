# Alert drill: calls the failing /error endpoint about 1,000 times (~4 minutes), then stops by itself.
# Used by scripts/trigger-alert.sh and .ps1. It follows the same baseline as the app (non-root, limits)
# so the Kyverno policies in policy/ stay green.
apiVersion: v1
kind: Pod
metadata:
  name: errload
  namespace: application
  labels:
    app: errload
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: errload
      image: curlimages/curl:8.10.1
      command: ["/bin/sh", "-c"]
      args:
        - i=0; while [ $i -lt 1000 ]; do curl -s -o /dev/null http://sre-metrics-app:5000/error; i=$((i+1)); sleep 0.2; done
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
