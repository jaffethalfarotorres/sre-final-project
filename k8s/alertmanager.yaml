apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: sre-final-project
data:
  alertmanager.yml: |
    # Credentials are read from files mounted from the "alertmanager-secret" Secret
    # (see k8s/alertmanager-secret.example.yaml). Alertmanager does not expand env vars.
    # EDIT the smtp_* and "to:" addresses below to your own before deploying.
    # On an IBM laptop (no personal Slack or mail allowed) use the phone push instead: python scripts/notify_setup.py
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'sre-alerts@example.com'
      smtp_auth_username: 'sre-alerts@example.com'
      smtp_auth_password_file: /etc/alertmanager-secrets/smtp-auth-password
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-notifications'
      routes:
        # Smoke-test alert: Slack only, long repeat interval to avoid noise
        - matchers:
            - severity = "demo"
          receiver: 'demo-receiver'
          repeat_interval: 12h

        # Incident automation (SRE Academy exercise 13): every critical alert also launches the
        # read-only "collect-diagnostics" AWX job, then continues to the human notifications below.
        # Remediation (restart) is never automatic: a person launches it after reading the report.
        # Harmless without AWX: the webhook just fails and Alertmanager logs it.
        - matchers:
            - severity = "critical"
          receiver: 'awx-collect-diagnostics'
          group_wait: 10s
          repeat_interval: 1h
          continue: true

        # ServiceDown, HighErrorRate: Slack + email, fast dispatch
        - matchers:
            - severity = "critical"
          receiver: 'critical-notifications'
          group_wait: 10s
          repeat_interval: 1h

        # HighLatency: Slack + email
        - matchers:
            - severity = "warning"
          receiver: 'warning-notifications'
          repeat_interval: 3h

    # Inhibition: when a bigger alert explains smaller ones, only the bigger one notifies people.
    # The muted alerts still show in the Alertmanager UI (marked "inhibited"), so nothing is hidden.
    # "equal: [service]" means: only for the same service (every rule in alerts.yml and slo.yml has it).
    inhibit_rules:
      # The app is down: errors, failed probes and budget burn are symptoms of the same outage.
      # ServiceDown fires only when ALL replicas are down or gone (alerts.yml). ReplicaDown (one pod of
      # two lost) is never a source here, so one lost pod cannot hide errors on the pod still serving.
      - source_matchers:
          - alertname = "ServiceDown"
        target_matchers:
          - alertname =~ "HighErrorRate|HighLatency|SyntheticProbeFailing|ErrorBudgetFastBurn|ErrorBudgetSlowBurn|ErrorBudgetTicket"
        equal: ['service']
      # A fast burn is already paging someone: the slower budget alerts would only repeat it.
      - source_matchers:
          - alertname = "ErrorBudgetFastBurn"
        target_matchers:
          - alertname =~ "ErrorBudgetSlowBurn|ErrorBudgetTicket"
        equal: ['service']
      - source_matchers:
          - alertname = "ErrorBudgetSlowBurn"
        target_matchers:
          - alertname = "ErrorBudgetTicket"
        equal: ['service']

    receivers:
      - name: 'awx-collect-diagnostics'
        webhook_configs:
          - url: 'http://awx-service.awx.svc.cluster.local/api/v2/job_templates/collect-diagnostics++Default/launch/'
            send_resolved: false
            http_config:
              authorization:
                type: Bearer
                # Written by scripts/awx_setup.py into the optional "awx-webhook-token" Secret.
                credentials_file: /etc/awx/token

      - name: 'critical-notifications'
        slack_configs:
          - channel: '#sre-alerts'
            send_resolved: true
            api_url_file: /etc/alertmanager-secrets/slack-webhook-url
            title: '[{{ .Status | toUpper }}] CRITICAL {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}
        email_configs:
          - to: 'sre-oncall@example.com'
            send_resolved: true
            headers:
              Subject: '[{{ .Status | toUpper }}] CRITICAL {{ .CommonLabels.alertname }}'
        # Phone push through ntfy (no account needed; works on IBM laptops). scripts/notify_setup.py writes
        # the private topic URL into the "ntfy-url" key of alertmanager-secret.
        webhook_configs:
          - url_file: /etc/alertmanager-secrets/ntfy-url
            send_resolved: true

      - name: 'warning-notifications'
        slack_configs:
          - channel: '#sre-alerts'
            send_resolved: true
            api_url_file: /etc/alertmanager-secrets/slack-webhook-url
            title: '[{{ .Status | toUpper }}] WARNING {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}
        email_configs:
          - to: 'sre-oncall@example.com'
            send_resolved: true
            headers:
              Subject: '[{{ .Status | toUpper }}] WARNING {{ .CommonLabels.alertname }}'
        # Phone push through ntfy (no account needed; works on IBM laptops). scripts/notify_setup.py writes
        # the private topic URL into the "ntfy-url" key of alertmanager-secret.
        webhook_configs:
          - url_file: /etc/alertmanager-secrets/ntfy-url
            send_resolved: true

      - name: 'demo-receiver'
        slack_configs:
          - channel: '#sre-alerts'
            send_resolved: true
            api_url_file: /etc/alertmanager-secrets/slack-webhook-url
            title: '[DEMO] {{ .CommonLabels.alertname }}'
            text: '{{ .CommonAnnotations.summary }}'

      - name: 'default-notifications'
        slack_configs:
          - channel: '#sre-alerts'
            send_resolved: true
            api_url_file: /etc/alertmanager-secrets/slack-webhook-url
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: '{{ .CommonAnnotations.summary }}'
        # Phone push through ntfy (no account needed; works on IBM laptops). scripts/notify_setup.py writes
        # the private topic URL into the "ntfy-url" key of alertmanager-secret.
        webhook_configs:
          - url_file: /etc/alertmanager-secrets/ntfy-url
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: sre-final-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      # Pod Security "restricted" profile: a numeric non-root user, the runtime's default seccomp profile, and
      # no automatic API token (this workload never calls the Kubernetes API).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - containerPort: 9093
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /-/ready
              port: 9093
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: alertmanager-secrets
              mountPath: /etc/alertmanager-secrets
              readOnly: true
            - name: awx-webhook-token
              mountPath: /etc/awx
              readOnly: true
      volumes:
        # Optional: only exists after the AWX add-on is set up (scripts/awx_setup.py).
        - name: awx-webhook-token
          secret:
            secretName: awx-webhook-token
            optional: true
        - name: config
          configMap:
            name: alertmanager-config
        # Required: the pod stays in ContainerCreating until this Secret exists.
        - name: alertmanager-secrets
          secret:
            secretName: alertmanager-secret
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: sre-final-project
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
