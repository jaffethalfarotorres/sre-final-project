groups:
  - name: sre-metrics-app-slo
    rules:
      # The app runs 2 replicas, so one lost pod is not an outage: the other pod still serves users.
      # ServiceDown pages only when NO app pod can be scraped:
      #   - sum(up) == 0: every app pod exists but none answers /metrics;
      #   - absent(up): Prometheus finds no app pod at all (for example the Deployment is scaled to 0).
      # Labels come from prometheus.yml: job "kubernetes-pods", and "app" copied from the pod label.
      - alert: ServiceDown
        expr: |
          sum(up{job="kubernetes-pods", namespace="application", app="sre-metrics-app"}) == 0
          or
          absent(up{job="kubernetes-pods", namespace="application", app="sre-metrics-app"})
        for: 1m
        labels:
          severity: critical
          service: sre-metrics-app
        annotations:
          summary: "Service sre-metrics-app is down (no replica can be scraped)"
          description: "No sre-metrics-app pod answers: every replica is down, or Prometheus finds no app pod at all."
          runbook_url: "https://github.com/jaffethalfarotorres/sre-final-project/blob/main/docs/runbooks/service-down.md"

      # Some replicas are down, but at least one still answers. Users are still served, so this is a
      # warning (the warning route: Slack, email and phone push; no AWX job). "for: 5m" lets a normal
      # rolling update or a pod restart finish without noise. Limit: a pod that never gets an IP
      # (Pending) is not a scrape target, so it is not counted here; "kubectl get pods" shows it.
      - alert: ReplicaDown
        expr: |
          sum(up{job="kubernetes-pods", namespace="application", app="sre-metrics-app"})
            < count(up{job="kubernetes-pods", namespace="application", app="sre-metrics-app"})
          and
          sum(up{job="kubernetes-pods", namespace="application", app="sre-metrics-app"}) > 0
        for: 5m
        labels:
          severity: warning
          service: sre-metrics-app
        annotations:
          summary: "Some replicas of sre-metrics-app are down"
          description: "Only {{ $value }} sre-metrics-app pod(s) answer. The others cannot be scraped. Users are still served."
          runbook_url: "https://github.com/jaffethalfarotorres/sre-final-project/blob/main/docs/runbooks/service-down.md"

      # HighErrorRate overlaps ErrorBudgetFastBurn (slo.yml) by design. A 5% error ratio is a burn rate
      # of 5x on the 1% budget. It is the fast symptom page: it needs only 5 minutes of data and fires
      # about 2-3 minutes into the drill. FastBurn also needs its 1-hour window, so on an older cluster
      # it fires some minutes later (see docs/SLO.md). Inhibition does not mute one with the other.
      # Error ratio over 5 minutes, but only when there is real traffic (more than 0.2 requests per
      # second, about 60 requests in 5 minutes). Without the floor, 1 failure out of 3 requests on a
      # quiet service would already page someone.
      - alert: HighErrorRate
        expr: |
          (sum(rate(http_requests_total{namespace="application", status=~"5.."}[5m])) / sum(rate(http_requests_total{namespace="application"}[5m]))) > 0.05
          and sum(rate(http_requests_total{namespace="application"}[5m])) > 0.2
        for: 2m
        labels:
          severity: critical
          service: sre-metrics-app
        annotations:
          summary: "High HTTP error rate (>5%) on sre-metrics-app"
          description: "HTTP 5xx error rate is {{ $value | humanizePercentage }} (threshold > 5%) over the last 5 minutes."
          runbook_url: "https://github.com/jaffethalfarotorres/sre-final-project/blob/main/docs/runbooks/high-error-rate.md"

      # Only /store, the user-facing transaction (same scope as the latency SLO). /ask is a slow
      # simulated model call (0.2-1.2 s) and would push the p95 over 500 ms on normal traffic.
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace="application", endpoint="/store"}[2m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
          service: sre-metrics-app
        annotations:
          summary: "High p95 latency (>500ms) on /store of sre-metrics-app"
          description: "p95 latency of /store is {{ $value | humanizeDuration }} (threshold > 500ms) over the last 2 minutes."
          runbook_url: "https://github.com/jaffethalfarotorres/sre-final-project/blob/main/docs/runbooks/high-latency.md"

      - alert: SyntheticProbeFailing
        expr: avg_over_time(probe_success{instance=~".*:5000/"}[2m]) < 0.9
        for: 2m
        labels:
          severity: critical
          service: sre-metrics-app
        annotations:
          summary: "Synthetic check of sre-metrics-app is failing"
          description: "The blackbox exporter could not reach {{ $labels.instance }} successfully in the last 2 minutes."
          runbook_url: "https://github.com/jaffethalfarotorres/sre-final-project/blob/main/docs/runbooks/service-down.md"

  - name: demo
    rules:
      - alert: AlwaysFiringDemoAlert
        expr: vector(1)
        for: 1m
        labels:
          severity: demo
        annotations:
          summary: "Demonstration alert for Alertmanager verification"
          description: "Continuous demo alert verifying Prometheus-to-Alertmanager alerting pipeline."

  # Who watches the watchers? Alertmanager is the one component that delivers every other alert, so it needs its own.
  # If it is down this alert cannot page anyone (it still shows red in Prometheus > Alerts), which is why real teams
  # also run a "dead man's switch": an alert that is always firing and an outside service that complains when it stops
  # arriving. The always-on AlwaysFiringDemoAlert in this lab is that alert.
  - name: sre-meta-monitoring
    rules:
      - alert: AlertmanagerDown
        expr: |
          sum(up{job="alertmanager"}) == 0
          or
          absent(up{job="alertmanager"})
        for: 2m
        labels:
          severity: critical
          service: alertmanager
        annotations:
          summary: "Alertmanager is down: no alert can be delivered"
          description: "Prometheus cannot scrape Alertmanager, so alerts are not being routed to anyone."
          runbook_url: "https://github.com/jaffethalfarotorres/sre-final-project/blob/main/docs/runbooks/alertmanager-down.md"
