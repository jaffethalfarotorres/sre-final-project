global:
  scrape_interval: 10s
  evaluation_interval: 10s
  # Labels added to every alert this Prometheus sends (not to stored series): they say where an alert came from.
  external_labels:
    cluster: minikube
    environment: lab

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Meta-monitoring: the alerting pipeline is watched like any other service (see AlertmanagerDown in alerts.yml).
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager.monitoring.svc.cluster.local:9093"]

  # Pull model + service discovery: every pod annotated with prometheus.io/scrape="true" is scraped.
  # This finds the app (/metrics on :5000) and the OpenTelemetry Collector (span metrics on :9464).
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: (.+):(?:\d+);(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

  # cAdvisor container metrics (CPU, memory, network, disk) from the kubelet, through the API server
  # proxy (SRE Academy exercises 7 and 11). Only the series used by the dashboards are kept.
  - job_name: kubernetes-cadvisor
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|network_receive_bytes_total|network_transmit_bytes_total|spec_memory_limit_bytes|spec_cpu_quota|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total)

  # Synthetic monitoring (SRE Academy topic 2): the blackbox exporter calls the app like a user
  # would and reports success and duration, independently of the app's own metrics.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://sre-metrics-app.application.svc.cluster.local:5000/
          - http://sre-metrics-app.application.svc.cluster.local:5000/store
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter.monitoring.svc.cluster.local:9115
