apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
type: Opaque
# Lab login, kept simple on purpose: admin / admin. Grafana is reachable only through a port-forward on your own
# laptop. scripts/deploy.* copies this file to k8s/grafana-secret.yaml (gitignored) on the first deploy. For anything
# shared or long-lived, put your own password in k8s/grafana-secret.yaml, then: kubectl apply -f k8s/grafana-secret.yaml
stringData:
  admin-user: admin
  admin-password: "admin"
