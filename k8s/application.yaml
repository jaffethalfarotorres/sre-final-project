apiVersion: v1
kind: Namespace
metadata:
  name: application
  labels:
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-metrics-app
  namespace: application
spec:
  # Two replicas so a pod can be lost (chaos test, rolling update) without downtime.
  replicas: 2
  # Rolling update (SRE Academy exercise 18): start one new pod before removing an old one and never
  # drop below the desired count. A broken image stays stuck in the new pod while old pods keep serving;
  # undo it with: kubectl rollout undo deployment/sre-metrics-app -n application
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: sre-metrics-app
  template:
    metadata:
      labels:
        app: sre-metrics-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "5000"
    spec:
      automountServiceAccountToken: false  # never calls the Kubernetes API
      # Least privilege (checked by the Kyverno policies in policy/): non-root, no privilege escalation.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: sre-metrics-app:1.0.0
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5000
          env:
            # Traces and logs go to the OpenTelemetry Collector over OTLP/gRPC.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.opentelemetry.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: sre-metrics-app
            # Standard OpenTelemetry resource attributes: they label every trace and log with where it ran.
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.version=1.0.0,deployment.environment.name=lab"
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # Generous timeouts: a busy Minikube node can delay responses.
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sre-metrics-app
  namespace: application
spec:
  selector:
    app: sre-metrics-app
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      automountServiceAccountToken: false  # never calls the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          # A user every 2 s on /store, plus an occasional /ask call for the LLM observability lab.
          args:
            - >-
              i=0; while true; do
                curl -s -o /dev/null http://sre-metrics-app:5000/store;
                i=$((i+1)); if [ $((i % 15)) -eq 0 ]; then curl -s -o /dev/null http://sre-metrics-app:5000/ask; fi;
                sleep 2;
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
# A PodDisruptionBudget limits VOLUNTARY disruptions (draining a node, upgrading the cluster): at most one of the two
# replicas may be taken down at a time, so the shop stays up while nodes are maintained. It does not stop crashes
# (involuntary disruptions) or a pod you delete by hand. On this one-node lab, a drain waits while only one replica
# is ready; that is the correct behaviour to learn.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sre-metrics-app
  namespace: application
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: sre-metrics-app
