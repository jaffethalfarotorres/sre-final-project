name: CD

# Builds a version-tagged image and pushes it to Docker Hub, then smoke-tests it on a kind cluster.
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
# Runs on version tags (git tag v1.0.0 && git push --tags) or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/sre-metrics-app
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  smoke-test:
    name: kind smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1

      - name: Build and load image into kind
        run: |
          docker build -t sre-metrics-app:smoke .
          kind load docker-image sre-metrics-app:smoke

      - name: Deploy the app chart without the Prometheus Operator CRDs
        run: |
          helm upgrade --install sre-metrics-app helm/sre-metrics-app \
            --namespace application --create-namespace \
            --set image.tag=smoke --set image.pullPolicy=Never \
            --set serviceMonitor.enabled=false
          kubectl rollout status deployment/sre-metrics-app -n application --timeout=120s

      - name: Check that /metrics is served after some traffic
        run: |
          kubectl -n application port-forward service/sre-metrics-app 5000:5000 &
          sleep 5
          for i in $(seq 1 10); do curl -s -o /dev/null http://localhost:5000/store; done
          curl -sf http://localhost:5000/metrics | grep http_requests_total
