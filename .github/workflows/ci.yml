name: CI

# Continuous Integration (SRE Academy exercises 3 and 16): every push and pull request is linted, tested,
# security-scanned and validated before anything can be released by cd.yml.
#   test         flake8 + pytest with coverage
#   security     bandit (static analysis) + pip-audit (known CVEs in dependencies)
#   validate     Helm chart, Kustomize render + kubeconform, Prometheus rules, Alertmanager, Grafana,
#                OpenTelemetry Collector and Loki configs
#   iac          Terraform fmt/validate, Ansible syntax-check + ansible-lint
#   docker-build multi-arch image build (linux/amd64 + linux/arm64 for Apple Silicon), no push
#   scripts      bash/shellcheck on Linux, bash 3.2 on macOS, PowerShell parser on Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROMETHEUS_VERSION: "2.54.1"
  ALERTMANAGER_VERSION: "0.27.0"
  KUBECONFORM_VERSION: "0.6.7"
  OTELCOL_IMAGE: otel/opentelemetry-collector-contrib:0.111.0
  LOKI_IMAGE: grafana/loki:3.1.0

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          # pytest-cov is only needed in CI, so it is installed here instead of in requirements-dev.txt
          pip install pytest-cov==5.0.0
      - name: flake8
        run: flake8 app tests scripts .claude/hooks --max-line-length=120
      - name: pytest with coverage
        run: pytest tests -q --cov=app --cov-report=term-missing

  security:
    name: Security scan (bandit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install bandit==1.7.10 pip-audit==2.7.3
      # Fails on findings of medium or higher severity AND confidence. B104 (bind to 0.0.0.0) is skipped on
      # purpose: a container must listen on all interfaces to be reachable through its Service.
      - name: bandit (fails on medium or high severity and confidence)
        run: bandit -r app scripts -ll -ii --skip B104
      # Blocking: a known vulnerability in a pinned dependency fails the build. (The course pinned Flask 3.0.3
      # and OpenTelemetry 1.27.0; pip-audit found CVEs in both, so the app was upgraded to Flask 3.1.3 and
      # OpenTelemetry 1.45.2.) The report is also written to the job summary.
      - name: pip-audit on the app dependencies
        run: |
          pip-audit -r app/requirements.txt --progress-spinner off --format markdown --output pip-audit.md || status=$?
          # pip-audit writes no file when nothing is found
          [ -s pip-audit.md ] || echo "pip-audit: no known vulnerabilities in app/requirements.txt" > pip-audit.md
          cat pip-audit.md
          cat pip-audit.md >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

  validate:
    name: Validate manifests, Helm chart and configs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  # v5.1.0
        with:
          version: v3.16.2

      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e  # v5.2.0
        with:
          version: v1.31.2

      - name: Helm lint and template
        run: |
          helm lint helm/sre-metrics-app
          helm template sre helm/sre-metrics-app --namespace application > /dev/null

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz
          ./kubeconform -v

      - name: Render Kustomize and validate with kubeconform
        run: |
          kubectl kustomize k8s > /tmp/rendered.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/rendered.yaml) objects"
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered.yaml
          # The Secret examples are applied separately by the deploy scripts, so they are not in the kustomization
          ./kubeconform -strict -summary k8s/alertmanager-secret.example.yaml k8s/grafana-secret.example.yaml
          # Add-on manifests (custom resources without a public schema are skipped, not failed)
          ./kubeconform -strict -summary -ignore-missing-schemas \
            k8s/ai/*.yaml k8s/drills/*.yaml awx/awx.yaml awx/rbac.yaml chaos/*.yaml gitops/*.yaml \
            policy/*.yaml progressive/*.yaml

      - name: Kubeconform on the rendered Helm chart
        run: |
          helm template sre helm/sre-metrics-app --namespace application \
            | ./kubeconform -strict -summary -ignore-missing-schemas -

      - name: Install promtool and amtool
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" | tar xz
          curl -sSfL "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz" | tar xz
          echo "PROMTOOL=$PWD/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" >> "$GITHUB_ENV"
          echo "AMTOOL=$PWD/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool" >> "$GITHUB_ENV"

      - name: Check Prometheus rules and config
        run: |
          "$PROMTOOL" check rules k8s/config/prometheus/alerts.yml k8s/config/prometheus/slo.yml
          # Unit tests: alerts stay silent on normal traffic and fire at the documented thresholds
          # (for example the error budget page at a 14.4x burn rate).
          "$PROMTOOL" test rules tests/rules/*.test.yml
          # --syntax-only skips the checks of referenced files (rule_files, the in-cluster service account
          # token and CA), which only exist inside the Prometheus pod.
          "$PROMTOOL" check config --syntax-only k8s/config/prometheus/prometheus.yml

      - name: Check Alertmanager config
        run: |
          pip install pyyaml==6.0.2
          python - <<'EOF'
          import yaml
          docs = [d for d in yaml.safe_load_all(open("k8s/alertmanager.yaml")) if d]
          cfg = next(d for d in docs if d["kind"] == "ConfigMap")
          open("/tmp/alertmanager.yml", "w").write(cfg["data"]["alertmanager.yml"])
          EOF
          # amtool validates that referenced *_file paths exist, so create dummy secret files
          sudo mkdir -p /etc/alertmanager-secrets
          echo x | sudo tee /etc/alertmanager-secrets/slack-webhook-url /etc/alertmanager-secrets/smtp-auth-password /etc/alertmanager-secrets/ntfy-url > /dev/null
          "$AMTOOL" check-config /tmp/alertmanager.yml

      - name: Check Grafana dashboards (valid JSON, unique uid)
        run: |
          python - <<'EOF'
          import glob
          import json
          import sys

          seen = {}
          failed = False
          for path in sorted(glob.glob("k8s/config/grafana/dashboards/*.json")):
              try:
                  dashboard = json.load(open(path))
              except json.JSONDecodeError as err:
                  print(f"::error file={path}::invalid JSON: {err}")
                  failed = True
                  continue
              uid = dashboard.get("uid")
              if not uid:
                  print(f"::error file={path}::dashboard has no uid")
                  failed = True
              elif uid in seen:
                  print(f"::error file={path}::uid '{uid}' is also used by {seen[uid]}")
                  failed = True
              else:
                  seen[uid] = path
                  print(f"ok  {path}  uid={uid}  title={dashboard.get('title')}")
          sys.exit(1 if failed or not seen else 0)
          EOF

      - name: Validate the OpenTelemetry Collector config
        run: |
          docker run --rm -v "$PWD/k8s/config:/cfg:ro" "$OTELCOL_IMAGE" validate --config=/cfg/otel-collector.yaml

      - name: Validate the Loki config
        run: |
          docker run --rm -v "$PWD/k8s/config:/cfg:ro" "$LOKI_IMAGE" -config.file=/cfg/loki.yaml -verify-config

  iac:
    name: Terraform and Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive -diff

      - name: terraform init and validate (no backend, no cluster needed)
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Ansible and the kubernetes.core collection used by the runbooks
        run: |
          pip install ansible-core==2.17.5 ansible-lint==24.10.0 ansible-compat==24.10.0
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: ansible-playbook --syntax-check
        run: |
          for playbook in ansible/site.yml ansible/runbooks/*.yml; do
            echo "::group::$playbook"
            ansible-playbook -i ansible/inventory.ini --syntax-check "$playbook"
            echo "::endgroup::"
          done

      # Blocking gate on the strictest 'production' profile (settings in .ansible-lint).
      - name: ansible-lint (production profile)
        run: ansible-lint --profile production ansible/site.yml ansible/runbooks/*.yml

  docker-build:
    name: Docker build (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build for Intel and Apple Silicon (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: sre-metrics-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scripts-linux:
    name: Shell scripts (bash + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: bash -n
        run: for f in scripts/*.sh; do echo "bash -n $f"; bash -n "$f"; done
      - name: shellcheck (pinned container)
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 --severity=warning scripts/*.sh

  scripts-macos:
    name: Shell scripts on macOS (bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: bash -n with the system bash 3.2
        run: |
          /bin/bash --version | head -1
          for f in scripts/*.sh; do echo "bash -n $f"; /bin/bash -n "$f"; done

  scripts-windows:
    name: PowerShell scripts (parser)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Parse every .ps1 file
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path scripts -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Output "::error file=scripts/$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Output "ok  $($file.Name)"
            }
          }
          if ($failed) { exit 1 }
