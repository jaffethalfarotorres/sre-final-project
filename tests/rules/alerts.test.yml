# Unit tests for the symptom alerts (k8s/config/prometheus/alerts.yml). See slo.test.yml for how to run.
rule_files:
  - ../../k8s/config/prometheus/alerts.yml

evaluation_interval: 1m

tests:
  # 1) Normal traffic (~1.3 requests per second, 0.5% of /store fails): HighErrorRate stays silent.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="application", endpoint="/", status="200"}'
        values: '0+50x60'
      - series: 'http_requests_total{namespace="application", endpoint="/store", status="200"}'
        values: '0+27.86x60'
      - series: 'http_requests_total{namespace="application", endpoint="/store", status="500"}'
        values: '0+0.14x60'
    alert_rule_test:
      - eval_time: 1h
        alertname: HighErrorRate
        exp_alerts: []

  # 2) The drill: ~4.2 failing calls per second on top of normal traffic. Fires after the 2-minute "for".
  - interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="application", endpoint="/", status="200"}'
        values: '0+78x20'
      - series: 'http_requests_total{namespace="application", endpoint="/error", status="500"}'
        values: '0x10 252+252x9'
    alert_rule_test:
      - eval_time: 11m
        alertname: HighErrorRate
        exp_alerts: []
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              service: sre-metrics-app
            exp_annotations:
              summary: "High HTTP error rate (>5%) on sre-metrics-app"
              description: "HTTP 5xx error rate is 76.36% (threshold > 5%) over the last 5 minutes."
              runbook_url: "https://github.com/jaffethalfarotorres/sre-final-project/blob/main/docs/runbooks/high-error-rate.md"

  # 3) Traffic floor: almost no traffic (1 request per minute) and half of it fails. A 50% ratio, but
  #    only ~0.02 requests per second, below the 0.2 floor, so nobody is paged for 1 failed request.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{namespace="application", endpoint="/store", status="200"}'
        values: '0+0.5x30'
      - series: 'http_requests_total{namespace="application", endpoint="/store", status="500"}'
        values: '0+0.5x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: HighErrorRate
        exp_alerts: []

  # 4) HighLatency watches /store only. /store is fast; the slow simulated model call /ask must not fire it.
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/store", le="0.25"}'
        values: '0+15x30'
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/store", le="0.5"}'
        values: '0+30x30'
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/store", le="1"}'
        values: '0+30x30'
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/store", le="+Inf"}'
        values: '0+30x30'
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/ask", le="0.25"}'
        values: '0x30'
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/ask", le="0.5"}'
        values: '0x30'
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/ask", le="1"}'
        values: '0+10x30'
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/ask", le="+Inf"}'
        values: '0+30x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: HighLatency
        exp_alerts: []

  # 5) /store itself is slow (most calls between 0.5 and 1 s): HighLatency fires.
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/store", le="0.25"}'
        values: '0+5x30'
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/store", le="0.5"}'
        values: '0+10x30'
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/store", le="1"}'
        values: '0+30x30'
      - series: 'http_request_duration_seconds_bucket{namespace="application", endpoint="/store", le="+Inf"}'
        values: '0+30x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: HighLatency
        exp_alerts:
          - exp_labels:
              severity: warning
              service: sre-metrics-app
            exp_annotations:
              summary: "High p95 latency (>500ms) on /store of sre-metrics-app"
              description: "p95 latency of /store is 962.5ms (threshold > 500ms) over the last 2 minutes."
              runbook_url: "https://github.com/jaffethalfarotorres/sre-final-project/blob/main/docs/runbooks/high-latency.md"

  # 6) One app pod of two is down for 10 minutes: only the ReplicaDown warning. The other pod still
  #    serves users, so ServiceDown (the page) must stay silent.
  - interval: 1m
    input_series:
      - series: 'up{job="kubernetes-pods", namespace="application", app="sre-metrics-app", pod="sre-metrics-app-a", instance="10.0.0.1:5000"}'
        values: '1x5 0x10'
      - series: 'up{job="kubernetes-pods", namespace="application", app="sre-metrics-app", pod="sre-metrics-app-b", instance="10.0.0.2:5000"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 15m
        alertname: ReplicaDown
        exp_alerts:
          - exp_labels:
              severity: warning
              service: sre-metrics-app
            exp_annotations:
              summary: "Some replicas of sre-metrics-app are down"
              description: "Only 1 sre-metrics-app pod(s) answer. The others cannot be scraped. Users are still served."
              runbook_url: "https://github.com/jaffethalfarotorres/sre-final-project/blob/main/docs/runbooks/service-down.md"

  # 7) A short blip of one pod (2 minutes, like a pod restart or rolling update) does not even warn.
  - interval: 1m
    input_series:
      - series: 'up{job="kubernetes-pods", namespace="application", app="sre-metrics-app", pod="sre-metrics-app-a", instance="10.0.0.1:5000"}'
        values: '1x5 0x2 1x8'
      - series: 'up{job="kubernetes-pods", namespace="application", app="sre-metrics-app", pod="sre-metrics-app-b", instance="10.0.0.2:5000"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: ReplicaDown
        exp_alerts: []
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts: []

  # 8) Both app pods are down: ServiceDown pages (critical). ReplicaDown stays silent, the page covers it.
  - interval: 1m
    input_series:
      - series: 'up{job="kubernetes-pods", namespace="application", app="sre-metrics-app", pod="sre-metrics-app-a", instance="10.0.0.1:5000"}'
        values: '1x5 0x10'
      - series: 'up{job="kubernetes-pods", namespace="application", app="sre-metrics-app", pod="sre-metrics-app-b", instance="10.0.0.2:5000"}'
        values: '1x5 0x10'
    alert_rule_test:
      - eval_time: 15m
        alertname: ReplicaDown
        exp_alerts: []
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              service: sre-metrics-app
            exp_annotations:
              summary: "Service sre-metrics-app is down (no replica can be scraped)"
              description: "No sre-metrics-app pod answers: every replica is down, or Prometheus finds no app pod at all."
              runbook_url: "https://github.com/jaffethalfarotorres/sre-final-project/blob/main/docs/runbooks/service-down.md"

  # 9) No app pod at all (Deployment scaled to 0): there is no "up" series to be 0, so absent() pages.
  #    Other pods (here the OpenTelemetry Collector) are still scraped; they must not hide the outage.
  - interval: 1m
    input_series:
      - series: 'up{job="kubernetes-pods", namespace="opentelemetry", app="otel-collector", pod="otel-collector-a", instance="10.0.0.9:9464"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 15m
        alertname: ReplicaDown
        exp_alerts: []
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              service: sre-metrics-app
              job: kubernetes-pods
              namespace: application
              app: sre-metrics-app
            exp_annotations:
              summary: "Service sre-metrics-app is down (no replica can be scraped)"
              description: "No sre-metrics-app pod answers: every replica is down, or Prometheus finds no app pod at all."
              runbook_url: "https://github.com/jaffethalfarotorres/sre-final-project/blob/main/docs/runbooks/service-down.md"
