# Least privilege for AWX jobs. scripts/awx_setup.py turns this ServiceAccount's token into an AWX
# "OpenShift or Kubernetes API Bearer Token" credential attached to the runbook job templates.
# It can read pods, logs, events and deployments in the application namespace, and patch only the
# app Deployment (needed by the human-approved restart runbook). Nothing else, nowhere else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: awx-runbooks
  namespace: awx
---
apiVersion: v1
kind: Secret
metadata:
  name: awx-runbooks-token
  namespace: awx
  annotations:
    kubernetes.io/service-account.name: awx-runbooks
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: awx-runbooks
  namespace: application
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["sre-metrics-app"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: awx-runbooks
  namespace: application
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: awx-runbooks
subjects:
  - kind: ServiceAccount
    name: awx-runbooks
    namespace: awx
