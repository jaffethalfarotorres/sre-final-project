# Policy as code with Kyverno (SRE Academy 2027, module M20).
# Guardrails that turn the ORR and security review into automatic admission checks for the app namespaces.
# They start in Audit mode (violations are only reported in PolicyReports); scripts/policy_setup.py
# shows how switching to Enforce makes the API server reject a non-compliant pod.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sre-workload-baseline
  annotations:
    policies.kyverno.io/title: SRE workload baseline
    policies.kyverno.io/category: SRE Academy
    policies.kyverno.io/description: >-
      Pods in the app namespaces must declare resource requests and limits, health probes,
      run as non-root, and use a pinned image tag (never :latest).
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-requests-and-limits
      match: &app-namespaces
        any:
          - resources:
              kinds: [Pod]
              namespaces: [application, "gitops-*", "sre-metrics-app-*", progressive]
      validate:
        message: "Every container needs CPU/memory requests and a memory limit (capacity planning, noisy neighbours)."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"

    - name: require-run-as-non-root
      match: *app-namespaces
      validate:
        message: "Pods must run as non-root (spec.securityContext.runAsNonRoot: true)."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true

    - name: disallow-latest-tag
      match: *app-namespaces
      validate:
        message: "Use a pinned image tag; ':latest' makes rollbacks and audits impossible."
        pattern:
          spec:
            containers:
              - image: "!*:latest & *:*"

    - name: require-readiness-probe
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [application, "gitops-*", "sre-metrics-app-*", progressive]
              selector:
                matchLabels:
                  app: sre-metrics-app
      validate:
        message: "The service must have a readiness probe so rolling updates never send traffic to a pod that is not ready."
        pattern:
          spec:
            containers:
              - readinessProbe:
                  httpGet:
                    path: "?*"
