{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "sre-metrics-app.fullname" . }}
  labels:
    {{- include "sre-metrics-app.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "sre-metrics-app.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: {{ .Values.podMonitor.port | default "http" }}
      path: {{ .Values.podMonitor.path | default "/metrics" }}
      interval: {{ .Values.podMonitor.interval | default "10s" }}
      scrapeTimeout: {{ .Values.podMonitor.scrapeTimeout | default "10s" }}
{{- end }}
