apiVersion: v1
kind: Service
metadata:
  name: {{ include "sre-metrics-app.fullname" . }}
  labels:
    {{- include "sre-metrics-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default 5000 }}
      protocol: TCP
  selector:
    {{- include "sre-metrics-app.selectorLabels" . | nindent 4 }}
