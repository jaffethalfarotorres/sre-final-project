# Default values for sre-metrics-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: sre-metrics-app
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "5000"

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 5000
  targetPort: 5000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Generous timeouts: a busy Minikube node (with the full monitoring stack) can delay responses.
livenessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}

# Extra environment variables for the application container
env: []

# Optional ConfigMap configuration
configMap:
  enabled: false
  data: {}

# Traffic generator configuration
trafficGenerator:
  enabled: true
  replicaCount: 1
  image:
    repository: curlimages/curl
    tag: "8.10.1"
    pullPolicy: IfNotPresent
  # Target URL to generate traffic against; defaults to http://<service-name>:<port>/store if empty
  targetUrl: ""
  intervalSeconds: 2
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# ServiceMonitor CRD for Prometheus Operator / kube-prometheus-stack
serviceMonitor:
  enabled: true
  interval: 10s
  scrapeTimeout: 10s
  path: /metrics
  port: http
  # Labels required for Prometheus Operator to discover this ServiceMonitor.
  # Example: release: kube-prometheus-stack
  labels: {}

# PodMonitor CRD for Prometheus Operator (alternative to ServiceMonitor)
podMonitor:
  enabled: false
  interval: 10s
  scrapeTimeout: 10s
  path: /metrics
  port: http
  labels: {}
